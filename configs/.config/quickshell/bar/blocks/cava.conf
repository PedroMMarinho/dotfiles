# Consumed by AudioLevels.qml — one raw ASCII frame per line on stdout,
# `bars` values in the 0..100 range separated by ';'.
# `bars` must stay in sync with AudioLevels.barCount.

[general]
mode = normal
framerate = 60
# Only the low bands drive the disc, so there is no point sampling more.
bars = 4
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average

[smoothing]
noise_reduction = 55
